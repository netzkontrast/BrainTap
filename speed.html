<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b5452b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<title>BrainTap Speed-Runde</title>
<style>
:root {
  --bg: #f6f4ef; --surface: #ffffff; --surface-2: #efece4; --text: #1d1b16; --muted: #6b665b;
  --border: #ddd8cc; --accent: #b5452b; --accent-text: #ffffff; --ok: #2f7a4a; --bad: #b3261e; --focus: #2563eb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15140f; --surface: #1f1d17; --surface-2: #29261e; --text: #efeadf; --muted: #a59f90;
    --border: #3a362b; --accent: #e0714f; --accent-text: #1a0d08; --ok: #5cbf80; --bad: #f2867d; --focus: #7aa7ff;
  }
}
:root[data-theme="dark"] {
  --bg: #15140f; --surface: #1f1d17; --surface-2: #29261e; --text: #efeadf; --muted: #a59f90;
  --border: #3a362b; --accent: #e0714f; --accent-text: #1a0d08; --ok: #5cbf80; --bad: #f2867d; --focus: #7aa7ff;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
main { max-width: 560px; margin: 0 auto; padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); min-height: 100%; display: flex; flex-direction: column; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 18px; }
.brand { font-weight: 800; letter-spacing: -0.01em; }
.brand span { color: var(--accent); }
.who { color: var(--muted); font-size: .9rem; text-align: right; overflow-wrap: anywhere; }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 10px; letter-spacing: -0.02em; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
.meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .9rem; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.question { font-size: 1.35rem; line-height: 1.3; font-weight: 650; margin: 0 0 16px; overflow-wrap: anywhere; }
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 4px 0 6px; }
.bar i { display: block; height: 100%; background: var(--accent); transform-origin: left; }
.left { font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.options { display: grid; gap: 10px; margin-top: 14px; }
button, input { font: inherit; }
.opt { display: flex; gap: 12px; align-items: center; width: 100%; min-height: 58px; padding: 12px 14px; text-align: left; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
.opt b { flex: none; width: 2em; height: 2em; display: grid; place-items: center; border-radius: 8px; background: var(--surface-2); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.opt[aria-pressed="true"] b { background: var(--accent); color: var(--accent-text); }
.opt:disabled { cursor: default; opacity: .75; }
.btn { min-height: 52px; padding: 12px 18px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-text); font-weight: 650; cursor: pointer; width: 100%; }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); min-height: 44px; font-weight: 500; }
.field { width: 100%; min-height: 56px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); color: var(--text); font-size: 1.15rem; }
.field.code { text-align: center; letter-spacing: .35em; text-transform: uppercase; font-weight: 700; font-size: 1.6rem; }
.stack { display: grid; gap: 12px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.status { margin-top: 14px; min-height: 1.5em; font-weight: 600; }
.status.ok { color: var(--ok); }
.status.bad { color: var(--bad); }
.big { font-size: 3.4rem; text-align: center; margin: 8px 0; }
.center { text-align: center; }
.result { font-size: 1.25rem; font-weight: 700; }
.result.ok { color: var(--ok); }
.result.bad { color: var(--bad); }
.notice { margin-top: auto; padding-top: 24px; color: var(--muted); font-size: .85rem; text-align: center; }
.offline { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; font-size: .9rem; }
.media { display: block; max-width: 100%; max-height: 38vh; margin: 0 auto 14px; border-radius: 10px; }
.hint { font-size: .85rem; color: var(--muted); margin: -8px 0 12px; }
.standing { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); font-weight: 650; }
.board { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; counter-reset: rank; }
.board li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.board li b { font-weight: 800; }
.board li.top { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.join-qr { display: flex; gap: 4vw; align-items: center; justify-content: center; flex-wrap: wrap; text-align: left; }
.join-url { font-size: clamp(1.2rem, 2.6vw, 3rem); font-weight: 800; margin: 0 0 12px; overflow-wrap: anywhere; }
.join-qr > div:last-child { flex: 1 1 300px; max-width: 60ch; }
.join-qr svg { width: min(34vh, 60vw); height: auto; background: #fff; padding: 12px; border-radius: 12px; }
/* Beamer */
body.screen main { max-width: none; padding: 4vh 5vw; }
body.screen header { font-size: 2.2vw; }
body.screen .question { font-size: clamp(2rem, 4.6vw, 5rem); }
body.screen .left { font-size: clamp(3rem, 7vw, 8rem); }
body.screen .options { grid-template-columns: 1fr 1fr; gap: 2vw; }
body.screen .opt { font-size: clamp(1.4rem, 2.6vw, 3rem); min-height: 12vh; }
body.screen .meta { font-size: 1.8vw; }
body.screen .card { padding: 3vw; }
body.screen .bar { height: 2vh; }
body.screen .status { font-size: clamp(1.2rem, 2.2vw, 2.6rem); }
body.screen .board li { font-size: clamp(1.1rem, 2.2vw, 2.4rem); padding: 1vh 1.5vw; }
body.screen .media { max-height: 42vh; }
body.screen .reveal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3vw; align-items: start; }
body.screen .sol-big { font-size: clamp(1.8rem, 4vw, 4.5rem); font-weight: 800; color: var(--ok); margin: 0 0 1vh; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">BrainTap <span>Speed-Runde</span></div>
    <div class="who" id="who"></div>
  </header>
  <div id="offline" class="offline" hidden>Keine Verbindung – wir versuchen es weiter …</div>
  <div id="view" aria-live="polite"></div>
  <p class="notice" id="notice"></p>
</main>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  var SCREEN = params.get("screen") === "1";
  var view = document.getElementById("view");
  var offset = 0;            // server clock minus device clock
  var data = null;           // last server view
  var pending = null;        // answer not yet confirmed by the server
  var picked = null;         // local choice for the open question
  var draftFor = null, draft = "";
  var timer = null, ticker = null;
  var joining = false, autoJoined = false;
  if (SCREEN) document.body.classList.add("screen");

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else if (k === "text") n.textContent = attrs[k];
      else if (k === "value") n.value = attrs[k];
      else if (attrs[k] != null && attrs[k] !== false) n.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    });
    (children || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function api(method, body) {
    return fetch("api/speed" + (SCREEN ? "?view=orga" : ""), {
      method: method, credentials: "same-origin",
      headers: body ? { "content-type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (j) { j.httpStatus = res.status; return j; });
    });
  }
  function now() { return Date.now() + offset; }
  function fmtSecs(ms) { return (ms / 1000).toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " s"; }
  function fmtPts(p) { return Number(p).toLocaleString("de-DE", { maximumFractionDigits: 1 }); }
  function media(q) {
    var src = q && q.media;
    if (!src) return null;
    if (/\.(png|jpe?g|webp|gif|svg|avif)(\?|$)/i.test(src)) return el("img", { class: "media", src: src, alt: "" });
    // Sound only on the beamer; phones stay silent.
    if (SCREEN && /\.(mp3|ogg|wav|m4a)(\?|$)/i.test(src)) return el("audio", { class: "media", src: src, controls: true, autoplay: true });
    return null;
  }
  // Points per team in the running round (beamer: from the organiser view).
  function totals() {
    var sums = {};
    (data.answers || []).forEach(function (a) { if (a.points != null) sums[a.team_id] = (sums[a.team_id] || 0) + a.points; });
    return (data.teams || []).map(function (t) { return { name: t.name, pts: Math.round((sums[t.id] || 0) * 10) / 10 }; })
      .sort(function (a, b) { return b.pts - a.pts || a.name.localeCompare(b.name); });
  }
  function board(limit) {
    var list = totals(), prev = null, rank = 0;
    return el("ol", { class: "board", "aria-label": "Stand der Speed-Runde" }, list.slice(0, limit).map(function (x, i) {
      if (x.pts !== prev) { rank = i + 1; prev = x.pts; }
      return el("li", { class: rank === 1 ? "top" : null }, [el("span", null, [el("b", { text: rank + ". " }), x.name]), el("span", { text: fmtPts(x.pts) + " P." })]);
    }));
  }
  function standingLine() {
    var s = data.standing;
    return s ? el("p", { class: "standing", text: "Platz " + s.rank + " von " + s.of + " · " + fmtPts(s.points) + " Punkte in dieser Runde" }) : null;
  }

  // Phones: keep the screen on while playing, buzz when a question opens.
  var wakeLock = null, buzzedFor = null;
  function keepAwake() {
    if (SCREEN || !navigator.wakeLock || wakeLock || document.visibilityState !== "visible") return;
    navigator.wakeLock.request("screen").then(function (l) {
      wakeLock = l; l.addEventListener("release", function () { wakeLock = null; });
    }).catch(function () { /* not allowed here; the page still works */ });
  }
  function buzz(st) {
    var k = st.roundId + "|" + st.n;
    if (SCREEN || st.status !== "question" || buzzedFor === k) return;
    if (buzzedFor !== null && navigator.vibrate) navigator.vibrate([120, 60, 120]);
    buzzedFor = k;
  }
  function secondsLeft(st) { return Math.max(0, Math.ceil((st.endsAt - now()) / 1000)); }
  function live(st) { return st.status === "question" && st.endsAt > now(); }

  /* ---------- Polling ---------- */
  function schedule() {
    clearTimeout(timer);
    if (joining) return; // the join form waits for the team, no polling meanwhile
    var fast = data && data.state && (data.state.status === "question" || data.state.status === "lobby");
    timer = setTimeout(poll, document.visibilityState === "visible" ? (fast ? 1000 : 2500) : 6000);
  }
  function poll() {
    api("GET").then(function (j) {
      document.getElementById("offline").hidden = true;
      if (j.httpStatus === 401) {
        data = null;
        if (SCREEN) renderNeedsOrga(); else if (!joining) { joining = true; renderJoin(); }
        return;
      }
      joining = false;
      if (j.httpStatus >= 400) throw new Error(j.error || "HTTP " + j.httpStatus);
      offset = j.serverTime - Date.now();
      data = j;
      if (data.state) buzz(data.state);
      if (data.team) keepAwake();
      if (pending) sendPending();
      render();
    }).catch(function () {
      document.getElementById("offline").hidden = false;
    }).then(schedule, schedule);
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") { poll(); if (data && data.team) keepAwake(); } });
  window.addEventListener("online", poll);

  /* ---------- Join ---------- */
  function renderJoin() {
    document.getElementById("who").textContent = "";
    document.getElementById("notice").textContent = "Ein Gerät pro Team. Den Code findet ihr auf eurer Tischkarte.";
    var input = el("input", { class: "field code", id: "code", inputmode: "text", autocomplete: "off", autocapitalize: "characters", spellcheck: "false", maxlength: 7, "aria-label": "Team-Code", placeholder: "•••••", value: params.get("code") || "" });
    var status = el("p", { class: "status bad", role: "status" });
    var form = el("form", { class: "stack", onsubmit: function (e) {
      e.preventDefault();
      var code = input.value.trim();
      if (!code) return;
      status.className = "status"; status.textContent = "Prüfe …";
      api("POST", { action: "join", code: code }).then(function (j) {
        if (j.httpStatus !== 200) { status.className = "status bad"; status.textContent = j.error || "Hat nicht geklappt"; return; }
        history.replaceState(null, "", location.pathname);
        joining = false;
        view.dataset.key = "";
        poll();
      }).catch(function () { status.className = "status bad"; status.textContent = "Keine Verbindung"; });
    } }, [
      el("h1", { text: "Team-Code eingeben" }),
      input,
      el("button", { class: "btn", type: "submit", text: "Mitspielen" }),
      status,
    ]);
    view.replaceChildren(el("div", { class: "card" }, [form]));
    if (!params.get("code")) input.focus();
    clearInterval(ticker);
    // A code from the QR link signs in right away (once).
    if (params.get("code") && !autoJoined) { autoJoined = true; form.requestSubmit(); }
  }
  function renderNeedsOrga() {
    view.replaceChildren(el("div", { class: "card" }, [
      el("h1", { text: "Beamer-Ansicht" }),
      el("p", { class: "muted", text: "Bitte zuerst im Planungstool anmelden, dann diese Seite neu laden." }),
      el("a", { class: "btn", href: "planung.html", style: "display:block;text-align:center;text-decoration:none;line-height:28px", text: "Zum Planungstool" }),
    ]));
  }

  /* ---------- Answering ---------- */
  function sendPending() {
    var p = pending;
    if (!p) return;
    setStatus("Wird gesendet …", "");
    api("POST", p).then(function (j) {
      if (pending !== p) return;
      if (j.httpStatus === 200) { pending = null; setStatus("Gespeichert: " + j.answer + " – ändern geht, bis die Zeit um ist.", "ok"); if (data && data.mine !== undefined) data.mine = { answer: j.answer, points: null }; }
      else if (j.httpStatus === 409 || j.httpStatus === 400) { pending = null; setStatus(j.error || "Nicht angenommen", "bad"); }
      else setStatus("Noch nicht gesendet, neuer Versuch …", "bad");
    }).catch(function () { setStatus("Keine Verbindung, Antwort wird nachgeschickt …", "bad"); });
  }
  function submit(body) {
    pending = Object.assign({ action: "answer", n: data.state.n }, body);
    sendPending();
  }
  function setStatus(text, kind) {
    var s = document.getElementById("answerStatus");
    if (s) { s.textContent = text; s.className = "status" + (kind ? " " + kind : ""); }
  }

  /* ---------- Rendering ---------- */
  function questionHead(st) {
    return el("div", { class: "meta" }, [el("span", { text: (st.roundName || "Speed-Runde") }), el("span", { text: "Frage " + st.n + " / " + st.of })]);
  }
  function countdown(st) {
    var left = el("div", { class: "left", id: "left" });
    var fill = el("i", { id: "fill" });
    function tick() {
      var s = secondsLeft(st);
      left.textContent = live(st) ? s + " s" : "Zeit um";
      fill.style.transform = "scaleX(" + (st.secs ? Math.max(0, (st.endsAt - now()) / (st.secs * 1000)) : 0) + ")";
      if (!live(st) && data && data.state === st && st.status === "question") { st.status = "closed"; render(); }
    }
    clearInterval(ticker);
    ticker = setInterval(tick, 200);
    tick();
    return [left, el("div", { class: "bar", "aria-hidden": "true" }, [fill])];
  }
  function render() {
    var st = data.state || { status: "off" };
    var key = st.status + "|" + st.n;
    if (!SCREEN) {
      document.getElementById("who").textContent = data.team ? data.team.name : "";
      document.getElementById("notice").replaceChildren(el("button", { class: "btn ghost", type: "button", text: "Anderes Team / abmelden", onclick: function () {
        if (!confirm("Dieses Gerät vom Team abmelden?")) return;
        api("POST", { action: "leave" }).then(function () { joining = false; poll(); });
      } }));
    }
    // Keep the screen stable (no flicker, no lost focus) while nothing changed.
    if (view.dataset.key === key && st.status === "question" && !SCREEN) return;
    view.dataset.key = key;
    if (st.status === "question" || st.status === "closed") return SCREEN ? renderScreenQuestion(st) : renderQuestion(st);
    if (st.status === "reveal") return SCREEN ? renderScreenQuestion(st) : renderReveal(st);
    clearInterval(ticker);
    var title = st.status === "done" ? "Speed-Runde vorbei" : st.status === "lobby" ? "Gleich geht's los" : "Noch keine Speed-Runde";
    var text = st.status === "done" ? "Danke! Das Handy darf jetzt wieder in die Tasche."
      : st.status === "lobby" ? "Ihr seid verbunden. Die erste Frage erscheint hier automatisch."
      : "Die Moderation startet die Runde gleich. Diese Seite einfach offen lassen.";
    if (SCREEN && st.status === "done") {
      view.replaceChildren(el("div", { class: "card" }, [el("h1", { text: "Endstand der Speed-Runde" }), board(20)]));
      return;
    }
    if (SCREEN) return renderScreenLobby();
    view.replaceChildren(el("div", { class: "card center" }, [
      el("div", { class: "big", "aria-hidden": "true", text: st.status === "done" ? "🏁" : "⚡" }),
      el("h1", { text: title }), el("p", { class: "muted", text: text }),
      st.status === "done" ? standingLine() : null,
    ]));
  }
  function renderQuestion(st) {
    var q = st.question || {};
    var open = live(st);
    if (draftFor !== key()) { draftFor = key(); draft = ""; picked = null; }
    var mine = data.mine && data.mine.answer;
    var body = [questionHead(st)].concat(countdown(st)).concat([el("p", { class: "question", text: q.text || "" }), media(q)]);
    if (st.scoring && st.scoring.tempo && open) body.push(el("p", { class: "hint", text: "Tempo-Punkte: je schneller richtig, desto mehr Punkte." }));
    if (q.kind === "mc") {
      body.push(el("div", { class: "options", role: "group", "aria-label": "Antwortmöglichkeiten" }, (q.options || []).map(function (o, i) {
        if (!o) return null;
        var label = "ABCDEF"[i] + ") " + o;
        var on = picked != null ? picked === i : mine === label;
        return el("button", { class: "opt", type: "button", "aria-pressed": String(on), disabled: !open, onclick: function () {
          picked = i;
          view.querySelectorAll(".opt").forEach(function (b, k) { b.setAttribute("aria-pressed", String(b === this)); }, this);
          submit({ choice: i });
        } }, [el("b", { text: "ABCDEF"[i] }), el("span", { text: o })]);
      })));
    } else {
      var input = el("input", { class: "field", type: "text", inputmode: q.kind === "estimate" ? "decimal" : "text", autocomplete: "off", "aria-label": "Eure Antwort", placeholder: q.kind === "estimate" ? "Zahl schätzen" : "Eure Antwort", disabled: !open, value: draft || mine || "", oninput: function (e) { draft = e.target.value; } });
      body.push(el("form", { class: "stack", onsubmit: function (e) { e.preventDefault(); if (input.value.trim()) submit({ answer: input.value.trim() }); } }, [
        input, el("button", { class: "btn", type: "submit", disabled: !open, text: mine ? "Antwort ändern" : "Antwort senden" }),
      ]));
    }
    body.push(el("p", { class: "status" + (mine ? " ok" : ""), id: "answerStatus", role: "status",
      text: !open ? (mine ? "Zeit um. Eure Antwort: " + mine : "Zeit um – keine Antwort abgegeben.") : mine ? "Gespeichert: " + mine + " – ändern geht, bis die Zeit um ist." : "" }));
    view.replaceChildren(el("div", { class: "card" }, body));
    if (pending) setStatus("Wird gesendet …", "");
  }
  function key() { return data.state.roundId + "|" + data.state.n; }
  function renderReveal(st) {
    clearInterval(ticker);
    var mine = data.mine;
    var verdict = mine && mine.points != null
      ? (mine.points > 0 ? "Richtig! +" + fmtPts(mine.points) + (mine.ms != null ? " · in " + fmtSecs(mine.ms) : "") : "Leider falsch")
      : mine ? "Wird von der Moderation gewertet" : "Keine Antwort abgegeben";
    view.replaceChildren(el("div", { class: "card" }, [
      questionHead(st),
      el("p", { class: "question", text: st.question ? st.question.text : "" }),
      el("p", { class: "muted", text: "Lösung" }), el("p", { class: "result", text: st.solution || "–" }),
      mine ? el("p", { class: "muted", text: "Eure Antwort: " + mine.answer }) : null,
      el("p", { class: "result " + (mine && mine.points > 0 ? "ok" : mine && mine.points === 0 ? "bad" : ""), text: verdict }),
      standingLine(),
    ]));
  }
  function renderScreenQuestion(st) {
    var q = st.question || {};
    var answered = (data.answers || []).filter(function (a) { return a.question === st.n && a.answer; }).length;
    var body = [questionHead(st)];
    if (st.status !== "reveal") body = body.concat(countdown(st)); else clearInterval(ticker);
    body.push(el("p", { class: "question", text: q.text || "" }));
    if (st.status !== "reveal") body.push(media(q));
    if (q.kind === "mc" && st.status !== "reveal") body.push(el("div", { class: "options" }, (q.options || []).map(function (o, i) {
      return o ? el("div", { class: "opt", "aria-pressed": String(st.status === "reveal" && data.solution.indexOf("ABCDEF"[i] + ")") === 0) }, [el("b", { text: "ABCDEF"[i] }), el("span", { text: o })]) : null;
    })));
    if (st.status === "reveal") {
      var fastest = (data.answers || []).filter(function (a) { return a.question === st.n && a.points > 0 && a.ms != null; })
        .sort(function (a, b) { return a.ms - b.ms; })[0];
      var team = fastest && (data.teams || []).find(function (t) { return t.id === fastest.team_id; });
      var right = (data.answers || []).filter(function (a) { return a.question === st.n && a.points > 0; }).length;
      body.push(el("div", { class: "reveal-grid" }, [
        el("div", null, [
          el("p", { class: "muted", text: "Lösung" }),
          el("p", { class: "sol-big", text: data.solution || "–" }),
          el("p", { class: "status", text: right + " von " + (data.teams || []).length + " Teams richtig" }),
          team ? el("p", { class: "status", text: "⚡ Am schnellsten: " + team.name + " in " + fmtSecs(fastest.ms) }) : null,
        ]),
        board(10),
      ]));
    } else {
      body.push(el("p", { class: "status", text: answered + " von " + (data.teams || []).length + " Teams haben geantwortet" }));
    }
    view.replaceChildren(el("div", { class: "card" }, body));
  }
  // Beamer before the first question: a QR code to the team page and who is in.
  var qrLoading = null;
  function renderScreenLobby() {
    var url = location.origin + location.pathname;
    var joined = data.joins ? Object.keys(data.joins).length : 0;
    var sig = "lobby|" + joined + "|" + (data.teams || []).length;
    if (view.dataset.lobby === sig && view.querySelector(".join-qr")) return; // no flicker every poll
    view.dataset.lobby = sig;
    var box = el("div", { class: "qrbox", "aria-hidden": "true" });
    view.replaceChildren(el("div", { class: "card" }, [
      el("div", { class: "join-qr" }, [box, el("div", null, [
        el("h1", { text: "Speed-Runde: ein Handy pro Team" }),
        el("p", { class: "join-url", text: url.replace(/^https?:\/\//, "") }),
        el("p", { class: "muted", text: "QR-Code scannen oder Adresse öffnen, dann den Code von der Tischkarte eingeben." }),
        el("p", { class: "status", text: joined + " von " + (data.teams || []).length + " Teams verbunden" }),
      ])]),
    ]));
    function draw() { if (window.qrcode) { var q = window.qrcode(0, "M"); q.addData(url); q.make(); box.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } }
    if (window.qrcode) return draw();
    qrLoading = qrLoading || new Promise(function (res) { var sc = document.createElement("script"); sc.src = "vendor/qrcode/qrcode.js"; sc.onload = res; sc.onerror = res; document.head.appendChild(sc); });
    qrLoading.then(draw);
  }

  poll();
})();
</script>
